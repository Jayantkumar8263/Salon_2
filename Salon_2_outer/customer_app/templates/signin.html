{% extends "base/base.html" %}
{% load static %}
{% block base %}
<div class="container-fluid bg-dark py-5 ">
  <div class="container">
    <div class="card bg-muted border-0 shadow rounded-0">
      <div class="card-body">
        <h1 class="text-center fw-bold text-dark my-4">Sign In</h1>
        <!-- Sign In form -->
        <form method="POST" action="">
          {% csrf_token %}
          <div class="row">
            <div class="mb-3">
              <label class="form-label fw-bold text-dark">Username</label>
              <input type="text" name="username" class="form-control" id="">
            </div>
            <div class="mb-3">
              <label for="inputPassword5" class="form-label fw-bold text-dark">Password</label>
              <input type="password" name="password" id="inputPassword5" class="form-control"
                aria-describedby="passwordHelpBlock">

              <div id="passwordHelpBlock" class="form-text">
                Your password must be 8-20 characters long, contain letters and numbers, and must not contain spaces,
                special characters, or emoji.
              </div>
            </div>
          </div>
          <button type="submit" class="btn btn-dark w-100 rounded-0">Submit</button>
        </form>
      </div>
    </div>
  </div>
</div>
<!-- registration link for users who are not signed in -->

<div class="container my-4">
  <div class="row">
    <div class="col text-center ">
      <h5 class="fw-bold">Don't have an account? <a href="{% url 'registration' %}">Register Here</a></h5>
    </div>
  </div>
  {% endblock base %}
