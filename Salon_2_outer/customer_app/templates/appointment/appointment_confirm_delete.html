{% extends "base/base.html" %}
{% block base %}
<div class="container mt-4">
    <h2>Confirm Appointment Cancellation</h2>
    <div class="alert alert-warning" role="alert">
        Are you sure you want to cancel your appointment with {{ appointment.staff.name }} for {{ appointment.service.name }} on {{ appointment.appointment_date }}?
    </div>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger fw-bold ">Yes, Cancel Appointment</button>
        <a href="{% url 'appointment_list' %}" class="btn btn-secondary">No, Go Back</a>
    </form>
</div>
{% endblock base %}
