{% extends "base/base.html" %}

{% block content %}
<div class="container mt-4">

  <h2 class="mb-4">Salon Settings</h2>

  <div class="card shadow-sm border-0">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}

        <!-- Salon name -->
        <div class="mb-3">
          <label class="form-label">Salon name</label>
          <input
            type="text"
            name="salon_name"
            class="form-control"
            value="{% if settings %}{{ settings.salon_name }}{% endif %}"
            placeholder="Enter salon name"
            required
          >
        </div>

        <!-- Address -->
        <div class="mb-3">
          <label class="form-label">Address</label>
          <textarea
            name="address"
            class="form-control"
            rows="3"
            placeholder="Enter salon address"
          >{% if settings %}{{ settings.address }}{% endif %}</textarea>
        </div>

        <!-- Contact + email -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Contact number</label>
            <input
              type="text"
              name="contact_number"
              class="form-control"
              value="{% if settings %}{{ settings.contact_number }}{% endif %}"
              placeholder="Phone number"
            >
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Email</label>
            <input
              type="email"
              name="email"
              class="form-control"
              value="{% if settings %}{{ settings.email }}{% endif %}"
              placeholder="Contact email"
            >
          </div>
        </div>

        <!-- Opening / closing time -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Opening time</label>
            <input
              type="time"
              name="opening_time"
              class="form-control"
              value="{% if settings and settings.opening_time %}{{ settings.opening_time|time:'H:i' }}{% endif %}"
            >
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Closing time</label>
            <input
              type="time"
              name="closing_time"
              class="form-control"
              value="{% if settings and settings.closing_time %}{{ settings.closing_time|time:'H:i' }}{% endif %}"
            >
          </div>
        </div>

        <div class="d-flex justify-content-end">
          <a href="{% url 'owner_dashboard' %}" class="btn btn-outline-secondary me-2">
            Cancel
          </a>
          <button type="submit" class="btn btn-dark">
            Save settings
          </button>
        </div>

      </form>
    </div>
  </div>

</div>
{% endblock %}
